name: Check file test
on:
  workflow_dispatch:
    inputs:
      script:
        description: The check file, base64
        required: true
      url:
        description: Installer to test (default is the published one)
        default: ''
      keyed:
        description: Give the copy starting settings with test keys, like a family copy (on/off)
        default: 'off'
      mic:
        description: Give the machine a microphone and speakers (on/off)
        default: 'off'
      loose:
        description: Run an unzipped copy from folders with spaces in their names (on/off)
        default: 'off'
      nodocs:
        description: Point the Documents folder at a place that does not exist, as after OneDrive is removed (on/off)
        default: 'off'
      again:
        description: Open the Setup file a second time afterwards (on/off)
        default: 'off'
      runtime:
        description: Collect Microsoft's Visual C++ runtime files from this machine's Visual Studio (on/off)
        default: 'off'
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Give the machine a microphone and speakers
        if: inputs.mic == 'on'
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1
      - name: Sound devices
        if: always()
        shell: powershell
        run: |
          Get-Service Audiosrv, AudioEndpointBuilder -ErrorAction SilentlyContinue | Format-Table Name, Status
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status
      - name: Install Jarvis
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          "before Jarvis is installed, Windows lists the running programs in $([math]::Round((Measure-Command { tasklist /fo csv /nh | Out-Null }).TotalSeconds, 1)) s"
          $url = '${{ inputs.url }}'
          if (-not $url) { $info = Invoke-RestMethod 'https://github.com/GelizonUX/jarvis-updates/releases/latest/download/latest.json'; $url = $info.url; "published version $($info.version)" }
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\setup.exe"
          $p = Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { throw 'the installer did not finish in 5 minutes' }
          "installer exit code $($p.ExitCode)"
          "installed: $(Test-Path "$env:LOCALAPPDATA\Programs\jarvis\Jarvis.exe")"
      - name: Make it a keyed copy
        if: inputs.keyed == 'on'
        shell: powershell
        run: |
          $k = [Text.Encoding]::UTF8.GetBytes('jarvis-family-copy')
          function Scramble($t) { $b = [Text.Encoding]::UTF8.GetBytes($t); for ($i = 0; $i -lt $b.Length; $i++) { $b[$i] = [byte]($b[$i] -bxor $k[$i % $k.Length]) }; [Convert]::ToBase64String($b) }
          $preset = @{
            config = @{ addressAs = "ma'am"; effort = 'medium'; userName = 'Tester' }
            keys = @{ anthropic = (Scramble 'sk-ant-test-0000000000000000000000000000000000'); deepgram = (Scramble 'test000000000000000000000000000000000000'); elevenlabs = (Scramble 'sk_test0000000000000000000000000000000000') }
            welcome = @{ id = 'test-1'; text = 'Welcome! I am glad to finally meet you. How may I help you?'; name = 'Tester'; from = 'The maker' }
          }
          $dir = "$env:LOCALAPPDATA\Programs\jarvis\resources\app.asar.unpacked"
          [IO.File]::WriteAllText("$dir\preset.json", ($preset | ConvertTo-Json -Depth 5 -Compress))
          "starting settings written: $((Get-Item "$dir\preset.json").Length) bytes"
      - name: An unzipped copy in folders with spaces
        if: inputs.loose == 'on'
        shell: powershell
        run: |
          $dest = 'C:\Users\runneradmin\Downloads\My Jarvis Folder\Jarvis-win32-x64'
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item "$env:LOCALAPPDATA\Programs\jarvis" $dest -Recurse
          $data = 'C:\Users\runneradmin\AppData\Roaming\Jarvis Data Folder'
          $tmp = 'C:\Users\runneradmin\AppData\Local\Temp Folder'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          "JARVIS_CHECK_EXE=$dest\Jarvis.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JARVIS_CHECK_DATA=$data" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JARVIS_CHECK_ARGS=--user-data-dir=`"$data`"" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tmp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tmp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "copy made: $(Test-Path "$dest\Jarvis.exe")"
      - name: A Documents folder that does not exist
        if: inputs.nodocs == 'on'
        shell: powershell
        run: |
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders'
          Set-ItemProperty $k -Name Personal -Value 'C:\Users\runneradmin\OneDrive\Documents'
          Set-ItemProperty $k -Name '{F42EE2D3-909F-4907-8871-4C22FC0BF756}' -Value 'C:\Users\runneradmin\OneDrive\Documents'
          "Documents as Windows now reports it: [$([Environment]::GetFolderPath('MyDocuments'))]"
      - name: Run the check file the way a person would
        shell: powershell
        env:
          JARVIS_CHECK_NOPAUSE: '1'
        run: |
          New-Item -ItemType Directory -Force 'C:\check folder' | Out-Null
          [IO.File]::WriteAllBytes('C:\check folder\Jarvis Check.cmd', [Convert]::FromBase64String('${{ inputs.script }}'))
          & 'C:\check folder\Jarvis Check.cmd'
          "exit code $LASTEXITCODE"
      - name: Show the report
        if: always()
        shell: powershell
        run: |
          $zip = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'Jarvis-report-*' | Select-Object -First 1
          "report: $($zip.FullName) $($zip.Length) bytes"
          if ($zip.PSIsContainer) { Copy-Item $zip.FullName out -Recurse } else { Expand-Archive $zip.FullName -DestinationPath out }
          Get-ChildItem out | Format-Table Name, Length
          Get-Content out\report.txt
      - name: Opening the Setup file again
        if: inputs.again == 'on'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($n) { $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("$pwd\out\$n.png"); $g.Dispose(); $bmp.Dispose() }
          New-Item -ItemType Directory -Force out | Out-Null
          Get-Process Jarvis -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          $made = (Get-Item "$env:LOCALAPPDATA\Programs\jarvis\resources").CreationTime
          $p = Start-Process "$env:RUNNER_TEMP\setup.exe" -PassThru
          Start-Sleep 8
          Shot 'setup-again-1-question'
          "the Setup file is waiting for an answer: $(-not $p.HasExited)"
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id)
          Start-Sleep 1
          $ws.SendKeys('y')
          Start-Sleep 14
          Shot 'setup-again-2-after-yes'
          "the Setup file closed: $($p.HasExited); Jarvis running: $(@(Get-Process Jarvis -ErrorAction SilentlyContinue).Count) processes"
          "his program folder was left alone: $((Get-Item "$env:LOCALAPPDATA\Programs\jarvis\resources").CreationTime -eq $made)"
      - name: Clicking his icon four times at once
        if: inputs.again == 'on'
        shell: powershell
        run: |
          Get-Process Jarvis -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          $exe = "$env:LOCALAPPDATA\Programs\jarvis\Jarvis.exe"
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          "his start-up entries before: $(((Get-ItemProperty $run).PSObject.Properties | Where-Object { $_.Value -match 'Jarvis' } | ForEach-Object { $_.Name }) -join ', ')"
          New-ItemProperty -Path $run -Name 'local.jarvis.companion' -Value "`"$exe`"" -Force | Out-Null
          "added the second entry that 1.35.1 used to write"
          1..4 | ForEach-Object { Start-Process $exe; Start-Sleep -Milliseconds 400 }
          Start-Sleep 45
          "his start-up entries after: $(((Get-ItemProperty $run).PSObject.Properties | Where-Object { $_.Value -match 'Jarvis' } | ForEach-Object { $_.Name }) -join ', ') (should be electron.app.Jarvis only)"
          "guard warnings about start-up items in his notes: $(@(Select-String -Path "$env:APPDATA\Jarvis\logs\jarvis.log" -Pattern 'guard: (warn|critical) startup:').Count) (should be 0)"
          $mains = @(Get-CimInstance Win32_Process -Filter "Name='Jarvis.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' })
          "main Jarvis programs after four quick clicks: $($mains.Count) (should be 1)"
          Get-Content "$env:APPDATA\Jarvis\logs\jarvis.log" -Tail 8 | ForEach-Object { if ($_.Length -gt 200) { $_.Substring(0, 200) } else { $_ } }
      - name: An update, the way he runs it himself
        if: inputs.again == 'on'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($n) { $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("$pwd\out\$n.png"); $g.Dispose(); $bmp.Dispose() }
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = "$env:LOCALAPPDATA\Programs\jarvis\Jarvis.exe"
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -match '^Jarvis' } | Select-Object -First 1
          $real = (Get-ItemProperty $key.PSPath).DisplayVersion
          Set-ItemProperty -Path $key.PSPath -Name DisplayVersion -Value '1.0.0'
          "installed version $real, shown to the installer as 1.0.0 (an older Jarvis)"
          if (-not (Get-Process Jarvis -ErrorAction SilentlyContinue)) { Start-Process $exe; Start-Sleep 15 }
          $old = (Get-Process Jarvis | Sort-Object StartTime | Select-Object -First 1).StartTime
          $made = (Get-Item "$env:LOCALAPPDATA\Programs\jarvis\resources").CreationTime
          $p = Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList '--updated', '--force-run' -PassThru
          # in a real update he closes himself the moment the installer has started
          Get-Process Jarvis -ErrorAction SilentlyContinue | Stop-Process -Force
          foreach ($t in 3, 7, 11, 16, 22, 30) {
            $wait = $t - ((Get-Date) - $p.StartTime).TotalSeconds
            if ($wait -gt 0) { Start-Sleep -Milliseconds ([int]($wait * 1000)) }
            if ($p.HasExited) { "at $t seconds the installer had already finished"; break }
            Shot "update-1-at-${t}s"
            $wins = @(Get-Process | Where-Object { $_.MainWindowTitle } | Where-Object { $_.Id -eq $p.Id -or $_.MainWindowTitle -match 'Jarvis|Setup|Install' } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" })
            "at $t seconds: windows on screen: $($wins -join ' | ')"
          }
          $null = $p.WaitForExit(240000)
          "the installer finished: $($p.HasExited), exit code $($p.ExitCode)"
          Start-Sleep 25
          Shot 'update-2-after'
          $j = @(Get-Process Jarvis -ErrorAction SilentlyContinue)
          "Jarvis after the update: $($j.Count) processes; he was reopened as a new copy: $(($j.Count -gt 0) -and (($j | Sort-Object StartTime | Select-Object -First 1).StartTime -gt $old))"
          "his program folder was replaced: $((Get-Item "$env:LOCALAPPDATA\Programs\jarvis\resources").CreationTime -ne $made); version now $((Get-ItemProperty $key.PSPath).DisplayVersion)"
          "his window: $(@(Get-Process Jarvis -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | ForEach-Object { $_.MainWindowTitle }) -join ', ')"
          "his start-up entries: $(((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').PSObject.Properties | Where-Object { $_.Value -match 'Jarvis' } | ForEach-Object { $_.Name }) -join ', ') (an update keeps it)"
      - name: What his notes say
        if: always()
        shell: powershell
        run: |
          $log = "$env:APPDATA\Jarvis\logs\jarvis.log"
          if (Test-Path $log) {
            Select-String -Path $log -Pattern 'selfcheck|wake:|Hey Jarvis|microphone:|Microphone|update:|watcher failed|START-UP|page error|window:' | ForEach-Object { $l = $_.Line; if ($l.Length -gt 230) { $l.Substring(0, 230) } else { $l } } | Select-Object -Last 40
            Copy-Item $log out\jarvis-log-end.txt -ErrorAction SilentlyContinue
          } else { "no notes file" }
          "Windows lists the running programs in $([math]::Round((Measure-Command { tasklist /fo csv /nh | Out-Null }).TotalSeconds, 1)) s with Jarvis $(if (Get-Process Jarvis -ErrorAction SilentlyContinue) { 'running' } else { 'closed' }) (tasklist), and in $([math]::Round((Measure-Command { powershell -NoProfile -NonInteractive -Command 'Get-Process | Select-Object Id,ProcessName,Path | ConvertTo-Json -Compress' | Out-Null }).TotalSeconds, 1)) s by PowerShell"
          $mods = @(Get-Process Jarvis -ErrorAction SilentlyContinue | ForEach-Object { $_.Modules } | Where-Object { $_.ModuleName -match '^(vcruntime140|msvcp140|onnxruntime)' } | ForEach-Object { $_.FileName } | Sort-Object -Unique)
          "Microsoft's runtime files and the wake-word engine, as loaded inside Jarvis:"
          $mods | ForEach-Object { "   $($_.Replace("$env:LOCALAPPDATA\Programs\jarvis\", '<his folder>\'))" }
          "runtime files loaded from his own folder: $(@($mods | Where-Object { $_ -like "$env:LOCALAPPDATA\Programs\jarvis\*" -and $_ -match 'vcruntime140|msvcp140' }).Count) of 5; from Windows' own folder: $(@($mods | Where-Object { $_ -like "$env:WINDIR\*" -and $_ -match 'vcruntime140|msvcp140' }).Count)"
          "files for ARM processors in his folder: $(@(Get-ChildItem "$env:LOCALAPPDATA\Programs\jarvis\resources" -Recurse -Directory -Filter arm64 -ErrorAction SilentlyContinue).Count) (should be 0)"
          "size of his program folder: $([math]::Round(((Get-ChildItem "$env:LOCALAPPDATA\Programs\jarvis" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))) MB"
      - name: Removing him
        if: inputs.again == 'on'
        shell: powershell
        run: |
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          Get-Process Jarvis -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          "his start-up entries before: $(((Get-ItemProperty $run).PSObject.Properties | Where-Object { $_.Value -match 'Jarvis' } | ForEach-Object { $_.Name }) -join ', ')"
          Start-Process "$env:LOCALAPPDATA\Programs\jarvis\Uninstall Jarvis.exe" -ArgumentList '/S' -Wait
          Start-Sleep 30
          "his program is gone: $(-not (Test-Path "$env:LOCALAPPDATA\Programs\jarvis\Jarvis.exe"))"
          if (Test-Path "$env:LOCALAPPDATA\Programs\jarvis") {
            "what was left in his folder: $((Get-ChildItem "$env:LOCALAPPDATA\Programs\jarvis" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { $_.FullName.Replace("$env:LOCALAPPDATA\Programs\jarvis\", '') }) -join ', ')"
            "programs still running from his folder: $((Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$env:LOCALAPPDATA\Programs\jarvis\*" } | ForEach-Object { $_.Name }) -join ', ')"
          }
          "his start-up entries after: '$(((Get-ItemProperty $run).PSObject.Properties | Where-Object { $_.Value -match 'Jarvis' } | ForEach-Object { $_.Name }) -join ', ')' (should be empty)"
          "his memories and settings were kept: $(Test-Path "$env:APPDATA\Jarvis\config.json")"
          "Jarvis processes left: $(@(Get-Process Jarvis -ErrorAction SilentlyContinue).Count)"
      - name: Microsoft's runtime files
        if: inputs.runtime == 'on'
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          "taken from: $($crt.FullName)"
          New-Item -ItemType Directory -Force runtime | Out-Null
          foreach ($n in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_atomic_wait.dll') {
            $f = Join-Path $crt.FullName $n
            $sig = Get-AuthenticodeSignature $f
            "{0} | {1} bytes | version {2} | signature {3}, {4} | sha256 {5}" -f $n, (Get-Item $f).Length, (Get-Item $f).VersionInfo.FileVersion, $sig.Status, ($sig.SignerCertificate.Subject -split ',')[0], (Get-FileHash $f -Algorithm SHA256).Hash
            Copy-Item $f runtime\
          }
      - uses: actions/upload-artifact@v4
        if: inputs.runtime == 'on'
        with:
          name: win-x64-runtime
          path: runtime
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-report
          path: out
